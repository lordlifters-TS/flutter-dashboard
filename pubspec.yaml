name: afyalink_dashboard
description: AFYALINK - Digital Patient Referral and Health Record Sharing Dashboard

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1

  # State Management
  provider: ^6.1.1
  flutter_riverpod: ^3.2.1

  # Navigation
  go_router: ^17.1.0

  # UI Components
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  fluttertoast: ^9.0.0
  badges: ^3.1.2
  fl_chart: ^1.1.1
  data_table_2: ^2.5.11
  timeline_tile: ^2.0.0
  step_progress_indicator: ^1.0.2

  # Forms & Validation
  flutter_form_builder: ^10.3.0+2
  form_builder_validators: ^11.3.0
  intl: ^0.20.2

  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.0.0

  # Date/Time
  syncfusion_flutter_datepicker: ^32.2.5

  # PDF / Print
  pdf: ^3.10.8
  printing: ^5.12.0

  # File handling
  file_picker: ^10.3.10
  open_filex: ^4.3.4

  # Utils
  equatable: ^2.0.5
  logger: ^2.0.2+1
  connectivity_plus: ^7.0.0
  url_launcher: ^6.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
